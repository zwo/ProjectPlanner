<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1>Project Planner</h1>
    </header>

    <!-- Top: Add Task area -->
    <section class="add-task" aria-label="Add task">
      <div class="task-type" role="radiogroup" aria-label="Type">
        <label class="radio">
          <input type="radio" name="task-type" value="task" checked />
          <span>Task</span>
        </label>
        <label class="radio">
          <input type="radio" name="task-type" value="milestone" />
          <span>Milestone</span>
        </label>
      </div>
      <button id="add-task-btn" class="btn btn--primary" type="button">Add Task</button>
    </section>

    <!-- Middle: Task list -->
    <section class="task-list-section" aria-label="Task list">
      <div id="task-list" class="task-list">
        <div class="task-list__empty" id="task-list-empty">
          No tasks yet. Add one to get started.
        </div>
      </div>
    </section>

    <!-- Bottom: Generate Calendar -->
    <section class="calendar-section" aria-label="Calendar">
      <button id="generate-calendar-btn" class="btn btn--generate" type="button" disabled>
        Generate Calendar
      </button>
      <div id="calendar-view" class="calendar-view"></div>
    </section>
  </div>

  <!-- Date Picker Modal -->
  <div id="modal-root"></div>

  <script src="datepicker.js"></script>
  <script src="colorpicker.js"></script>
  <script src="calendar.js"></script>
  <script src="app.js"></script>
</body>
</html>
